<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9">
  <meta name="color-scheme" content="light">
  <title>iPass Badge Check</title>
  <link rel="stylesheet" href="style.css">
  <!-- GENERATED by `npm run build:<env>`: window.APP_CONFIG -->
  <script src="config.js"></script>
</head>
<body>

  <main id="app" aria-live="polite"></main>

  <!-- Shown by app.js when the app cannot start (no config, old WebView). -->
  <div id="fatal" class="fatal" hidden>
    <h1>iPass Badge Check cannot start</h1>
    <p id="fatal-text"></p>
  </div>

  <!-- One template per screen. The screen modules (js/screens/*) fill them. -->

  <template id="tpl-login">
    <section class="screen screen-login">
      <div class="login-body">
        <div class="login-brand">
          <div class="logo" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><path d="M13 7h4v2"/><path d="M7 15v2h2"/></svg>
          </div>
          <h1 class="login-title">iPass Badge Check</h1>
          <p class="login-subtitle">Sign in with your iPass account</p>
          <p class="env-badge" data-ref="env" hidden></p>
        </div>
        <form class="login-form" data-ref="form" novalidate>
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" class="input" data-ref="username" type="text" name="username"
              autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input id="login-password" class="input input-password" data-ref="password" type="password"
                name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
              <button class="eye-btn" type="button" data-ref="toggle" aria-label="Show password" aria-pressed="false">
                <svg data-ref="eyeOpen" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-ref="eyeClosed" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9"/><path d="M9.9 5.2A9.1 9.1 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>
              </button>
            </div>
          </div>
          <div class="message-box" data-ref="message" role="alert" hidden>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span data-ref="messageText"></span>
          </div>
          <button class="btn btn-primary btn-lg login-submit" type="submit" data-ref="submit">Sign in</button>
        </form>
      </div>
    </section>
  </template>

  <template id="tpl-accessDenied">
    <section class="screen screen-denied">
      <div class="denied-body">
        <div class="denied-head">
          <div class="round-icon round-icon-grey" aria-hidden="true">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </div>
          <h1 class="denied-title">This app is for admins and volunteers</h1>
          <p class="denied-text">Your iPass role does not have the badge check permission. Ask an admin if you need it.</p>
        </div>
        <section class="account-card" data-ref="account" hidden>
          <div class="account-id">
            <span class="label-caps">Signed in as</span>
            <span class="account-name" data-ref="username"></span>
          </div>
          <span class="chip chip-grey" data-ref="role"></span>
        </section>
        <div class="bottom-actions">
          <button class="btn btn-primary btn-lg" type="button" data-ref="again">Sign in with another account</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-list">
    <section class="screen screen-list">
      <header class="list-header">
        <div class="list-heading">
          <h1 class="list-title">Checked in now <span class="list-count" data-ref="count"></span></h1>
          <p class="list-slot" data-ref="slot"></p>
        </div>
        <button class="icon-btn signout-btn" type="button" data-ref="signOut" aria-label="Sign out">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </header>
      <div class="list-scroll" data-ref="scroll">
        <div class="ptr" data-ref="ptr" aria-hidden="true"><span class="spinner" data-ref="ptrSpinner"></span></div>
        <div class="list-notice" data-ref="notice" role="alert" hidden>
          <span data-ref="noticeText"></span>
          <button class="link-btn" type="button" data-ref="noticeRetry">Retry</button>
        </div>
        <div class="cards" data-ref="cards"></div>
        <div class="list-state" data-ref="state" hidden>
          <span class="spinner" data-ref="stateSpinner" aria-hidden="true"></span>
          <p data-ref="stateText"></p>
          <button class="btn btn-secondary" type="button" data-ref="stateRetry" hidden>Retry</button>
        </div>
        <div class="list-footer" data-ref="footer" role="status">
          <span class="spinner" data-ref="footerSpinner" aria-hidden="true" hidden></span>
          <span data-ref="footerText"></span>
          <button class="link-btn" type="button" data-ref="footerRetry" hidden>Retry</button>
        </div>
      </div>
      <button class="fab" type="button" data-ref="scan">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/></svg>
        Scan badge
      </button>
    </section>
  </template>

  <!-- One card of the list (filled by js/screens/list.js). -->
  <template id="tpl-card">
    <article class="card">
      <div class="card-top">
        <img class="avatar" data-ref="photo" src="assets/avatar.svg" alt="" width="48" height="48">
        <div class="card-id">
          <strong class="card-name" data-ref="name"></strong>
          <span class="card-number" data-ref="number"></span>
        </div>
        <span class="badge-in">In room</span>
      </div>
      <dl class="card-facts">
        <div><dt>Start time</dt><dd data-ref="start"></dd></div>
        <div><dt>Purpose of visit</dt><dd data-ref="activity"></dd></div>
        <div><dt>End time</dt><dd data-ref="end"></dd></div>
      </dl>
    </article>
  </template>

  <template id="tpl-scanner">
    <section class="screen screen-scanner">
      <header class="scanner-header">
        <button class="dark-icon-btn" type="button" data-ref="close" aria-label="Close scanner">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
        <h1 class="scanner-title">Badge check</h1>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>
      <div class="slot-card" data-ref="slotCard">
        <span class="slot-dot" data-ref="slotDot" aria-hidden="true"></span>
        <div class="slot-text">
          <span class="slot-label" data-ref="slotLabel">Current slot</span>
          <span class="slot-value" data-ref="slotValue">…</span>
        </div>
      </div>
      <div class="scanner-main">
        <div class="scan-frame" data-ref="frame" role="img" aria-label="Camera view with scan frame">
          <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span><span class="corner corner-br"></span>
          <span class="scan-line" data-ref="line"></span>
          <div class="scan-checking" data-ref="checking" role="status" hidden>
            <span class="spinner spinner-light" aria-hidden="true"></span>
            <span>Checking…</span>
          </div>
        </div>
        <div class="scanner-message" data-ref="message" role="alert" hidden>
          <p class="scanner-message-title" data-ref="messageTitle"></p>
          <p class="scanner-message-text" data-ref="messageText"></p>
          <button class="btn btn-light" type="button" data-ref="messageAction" hidden></button>
        </div>
      </div>
      <p class="scan-hint" data-ref="hint">Point the back camera at the QR code on the badge</p>
      <div class="torch-row">
        <button class="torch-btn" type="button" data-ref="torch" aria-label="Turn on torch" aria-pressed="false" hidden>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v4l-3 5v11H9V11L6 6V2z"/><path d="M6 6h12"/><path d="M12 14v2"/></svg>
        </button>
      </div>
      <!-- The "Local build only · simulate a scan" box is added by scanner.js in the local build
           only; it is not in the DOM of the other builds. -->
      <div data-ref="simulateSlot"></div>
    </section>
  </template>

  <template id="tpl-result">
    <section class="screen screen-result" data-ref="screen">
      <div class="result-body">
        <div class="result-head">
          <div class="round-icon result-icon" data-ref="icon" aria-hidden="true"></div>
          <h1 class="result-title" data-ref="title"></h1>
          <p class="result-subtitle" data-ref="subtitle"></p>
        </div>
        <section class="result-card" data-ref="card"></section>
        <div class="bottom-actions result-actions">
          <button class="btn btn-lg result-primary" type="button" data-ref="primary"></button>
          <button class="btn btn-lg result-secondary" type="button" data-ref="secondary"></button>
        </div>
      </div>
    </section>
  </template>

  <!-- ES modules need a Chromium 61+ WebView (risk K8). -->
  <script nomodule>
    document.getElementById('fatal-text').textContent =
      'Update Android System WebView from the Play Store, then open the app again.';
    document.getElementById('fatal').hidden = false;
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
